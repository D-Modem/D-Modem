[general]
debug = 1

[bbs]
mode = tcp
host = 127.0.0.1
port = 2323

[term]
mode = tcp
host = 127.0.0.1
port = 2324

; the same BBS on a unix socket, the call's details first (run.sh puts
; its run directory for @RUN@)
[bbsunix]
mode = unix
path = @RUN@/bbs.sock
header = yes

; the same BBS as a program on the pty
[bbsexec]
mode = exec
command = exec python3 -I "$DMODEM_TEST/bbs_sim.py" --stdio

; the BBS with a person's call to an extension first (voice.sh puts the
; extension for @VOICE@)
[voice]
mode = tcp
host = 127.0.0.1
port = 2323
voice = @VOICE@
voice_listen = 4

; the caller with DSVD (voice.sh dsvd): its voice channel to talk
[dsvdterm]
mode = tcp
host = 127.0.0.1
port = 2324
voice = talk@voice-ivr
voice_dsvd = open
