# Every job but windows-msvc builds with Clang: the build takes it where it
# is installed (DMODEM_PREFER_CLANG; for Windows
# platforms/windows/mingw-w64.cmake), with GCC's C++ library (libstdc++;
# g++ and g++-multilib stay for it).
#
# build: everything (with the 32 bit interop test programs, against Smart
# Link's original DSP library) and the offline tests, V.110's against
# libosmocore's (dsp/test/v110_osmo_test.cpp, its 1.14.2 source cloned).  The interop calls
# (ctest -L "smartlink|agere|open" -j16, about a minute) are left out:
# they depend on the runner's timing.
#
# musl: the same build and offline tests on musl libc (Alpine).
#
# windows: the Windows build (MinGW-w64, cross from Linux) with its
# offline tests under Wine; dmodemd.exe kept as an artifact.
#
# windows-msvc: the same with Microsoft's compiler (cl.exe, Ninja) on a
# Windows runner, the offline tests on Windows itself; its dmodemd.exe
# kept as an artifact too, and the virtual modem driver's package
# (dmodemvm.dll, unsigned, when the runner's WDK has UMDF 2.15; dmodem.inf
# and dmodem-driver.exe).
#
# macos: the macOS build (11 and later) on Apple silicon, universal
# (arm64 and x86_64: libre, Mbed TLS, libusb and GoogleTest fetched and
# built for both), warnings as errors; the offline tests, and the USB
# modems' calls with the fake modems linked into dmodemd (no LD_PRELOAD
# there); dmodemd kept as an artifact.
#
# haiku: the Haiku build (x86_64, Clang, cross from Linux against a
# sysroot of Haiku's own packages, platforms/haiku/haiku_sysroot.py),
# warnings as errors; nothing here runs its programs, so no tests;
# dmodemd kept as an artifact.
#
# asterisk, freeswitch: the modules' tests (frontend/asterisk/test,
# frontend/freeswitch/test) in a private Asterisk (Ubuntu's packages) and
# FreeSWITCH (built from source by
# frontend/freeswitch/test/build_freeswitch.sh, cached): calls between two
# modems of the module, D-Modem (dmodemd) over SIP both ways, and faxes
# on the audio and over T.38, also against their own fax (spandsp);
# in Asterisk also through dmodem-ari, D-Modem as an ARI application, and
# dmodemd's class 1 fax with efax on its pty.
#
# The asterisk and freeswitch tests are mostly calls and faxes in real
# time (a fax about a minute), one after another: split in shards (the
# matrix), each a job of its own on its own runner, side by side, each
# with its own build.
#
# ccache keeps the jobs' compiles (all but windows-msvc): restored before
# the build, saved after it (in a sharded job by its first shard alone).
#
# Packages: apt's and Homebrew's downloads are cached
# (.github/actions/apt, .github/actions/brew), keyed on the runner image
# and the package list, so a mirror that stalls doesn't stall the run.
#
# A push or pull request that changes only documentation (docs/, the
# Markdown files and COPYING: nothing builds or tests from them) runs
# none of it; but for docs/cellular/annexes.tex, whose Annex E the
# v44_preset_check test compares with the code.  (The patterns are
# paths, not paths-ignore, so that a later one can take a file back.)  A
# push runs it on main alone (a branch's commits run it as its pull
# request, not twice), or by hand (workflow_dispatch); a newer push to a
# pull request cancels its older run.
name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!COPYING'
      - 'docs/cellular/annexes.tex'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!COPYING'
      - 'docs/cellular/annexes.tex'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6

      - name: Packages
        uses: ./.github/actions/apt
        with:
          packages: >-
            cmake ninja-build pkg-config clang g++ libssl-dev libgtest-dev
            libspandsp-dev libtiff-tools asterisk-dev g++-multilib
            libasound2-dev libusb-1.0-0-dev ccache

      # libre is fetched and built while configuring: keep it
      - name: libre cache
        uses: actions/cache@v5
        with:
          path: build/_deps/libre-install
          key: libre-v4.12.0-${{ runner.os }}-${{ hashFiles('cmake/libre.cmake') }}

      - name: ccache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/ccache
          key: ccache-build-${{ github.sha }}
          restore-keys: ccache-build-

      # libosmocore's V.110, the other end of v110_osmo_test
      - name: libosmocore
        run: |
          git clone --depth 1 -b 1.14.2 \
            https://gitea.osmocom.org/osmocom/libosmocore.git \
            "$RUNNER_TEMP/libosmocore"

      - name: Configure
        run: |
          cmake -B build -G Ninja -DDMODEM_WERROR=ON \
            -DOSMOCORE_SRC="$RUNNER_TEMP/libosmocore"

      - name: Build
        run: cmake --build build && ccache -s

      - name: ccache save
        uses: actions/cache/save@v5
        with:
          path: /tmp/ccache
          key: ccache-build-${{ github.sha }}

      - name: Tests
        run: ctest --test-dir build -L "quick|spandsp|alsa" -j4 --output-on-failure

      # the failed tests' output and logs (build/test-logs/<run>/<test>/;
      # a run without a failure keeps none)
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            build/test-logs/
            !build/test-logs/latest
          if-no-files-found: ignore
          retention-days: 14

      # dmodemd started as root (ctest skips it as the runner's user)
      - name: dmodemd as root
        run: sudo python3 frontend/dmodemd/test/root_test.py build/dmodemd/dmodemd

  musl:
    runs-on: ubuntu-24.04
    container: alpine:3.22
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      # (git first: checkout then clones, as libre's fetch wants)
      - name: Packages
        run: |
          apk add --no-cache build-base clang cmake samurai git pkgconf \
            openssl-dev gtest-dev linux-headers alsa-lib-dev libusb-dev python3 \
            bash coreutils spandsp-dev tiff-dev tiff-tools ccache tar zstd

      - uses: actions/checkout@v6

      - name: ccache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/ccache
          key: ccache-musl-${{ github.sha }}
          restore-keys: ccache-musl-

      - name: Configure
        run: cmake -B build -G Ninja -DDMODEM_WERROR=ON

      - name: Build
        run: cmake --build build && ccache -s

      - name: ccache save
        uses: actions/cache/save@v5
        with:
          path: /tmp/ccache
          key: ccache-musl-${{ github.sha }}

      # (as root in the container: dmodemd_root runs too)
      - name: Tests
        run: ctest --test-dir build -L "quick|spandsp|alsa" -j4 --output-on-failure

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-musl
          path: |
            build/test-logs/
            !build/test-logs/latest
          if-no-files-found: ignore
          retention-days: 14

  windows:
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6

      - name: Packages
        uses: ./.github/actions/apt
        with:
          packages: >-
            cmake ninja-build pkg-config g++-mingw-w64-x86-64-posix
            clang lld wine wine64 ccache

      # libre and Mbed TLS are fetched and built while configuring: keep
      # them
      - name: libre cache
        uses: actions/cache@v5
        with:
          path: build-win/_deps/libre-install
          key: libre-v4.12.0-mingw-${{ hashFiles('cmake/libre.cmake', 'platforms/windows/mingw-w64.cmake') }}

      - name: ccache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/ccache
          key: ccache-mingw-${{ github.sha }}
          restore-keys: ccache-mingw-

      - name: Configure
        run: |
          cmake -B build-win -G Ninja -DDMODEM_WERROR=ON \
            -DCMAKE_TOOLCHAIN_FILE=platforms/windows/mingw-w64.cmake

      - name: Build
        run: cmake --build build-win && ccache -s

      - name: ccache save
        uses: actions/cache/save@v5
        with:
          path: /tmp/ccache
          key: ccache-mingw-${{ github.sha }}

      # (Wine's first start makes its prefix: before the tests' timeouts)
      - name: Wine prefix
        run: wineboot --init && wineserver -w

      # (Wine's own processes, wineserver and its services, kept running
      # by an idle cmd waiting on a pipe, all with their output nowhere:
      # started by a test's wine they took its stdout with them, and
      # ctest waited on that pipe until its timeout, the test long done)
      - name: Tests
        run: |
          wineserver -p </dev/null >/dev/null 2>&1
          (sleep 7200 </dev/null 2>/dev/null | wine cmd /c "set /p x=" >/dev/null 2>&1 &)
          wine cmd /c exit </dev/null >/dev/null 2>&1
          ctest --test-dir build-win -L quick -j4 --output-on-failure

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-windows
          path: |
            build-win/test-logs/
            !build-win/test-logs/latest
          if-no-files-found: ignore
          retention-days: 14

      - name: dmodemd.exe
        uses: actions/upload-artifact@v7
        with:
          name: dmodemd-windows-x86_64
          path: build-win/dmodemd/dmodemd.exe
          retention-days: 30

  windows-msvc:
    runs-on: windows-2022
    steps:
      # (LF as in the repository: .gitattributes says so, this makes sure)
      - name: Line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      # cl.exe and the SDK: the Developer Command Prompt's environment,
      # for every later step
      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                "$($matches[1])=$($matches[2])" |
                  Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
            }

      - name: libre cache
        uses: actions/cache@v5
        with:
          path: build-msvc/_deps/libre-install
          key: libre-v4.12.0-msvc-${{ hashFiles('cmake/libre.cmake') }}

      - name: Configure
        run: >
          cmake -B build-msvc -G Ninja -DDMODEM_WERROR=ON
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        run: cmake --build build-msvc

      - name: Tests
        run: ctest --test-dir build-msvc -L quick -j4 --output-on-failure

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-windows-msvc
          path: |
            build-msvc/test-logs/
            !build-msvc/test-logs/latest
          if-no-files-found: ignore
          retention-days: 14

      - name: dmodemd.exe
        uses: actions/upload-artifact@v7
        with:
          name: dmodemd-windows-msvc-x86_64
          path: build-msvc/dmodemd/dmodemd.exe
          retention-days: 30

      # (unsigned: docs/windows.md has the test signing)
      - name: Virtual modem driver
        uses: actions/upload-artifact@v7
        with:
          name: dmodem-driver-windows-x86_64-unsigned
          path: |
            build-msvc/winmodem/dmodemvm.dll
            build-msvc/winmodem/dmodem-driver.exe
            platforms/windows/winmodem/dmodem.inf
          if-no-files-found: warn
          retention-days: 30

  macos:
    runs-on: macos-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6

      - name: Packages
        uses: ./.github/actions/brew
        with:
          packages: ninja ccache

      - name: libre cache
        uses: actions/cache@v5
        with:
          path: build-mac/_deps/libre-install
          key: libre-v4.12.0-macos-universal-${{ hashFiles('cmake/libre.cmake') }}

      - name: ccache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      # (GoogleTest fetched, not Homebrew's: that one is arm64 alone)
      - name: Configure
        run: |
          cmake -B build-mac -G Ninja -DDMODEM_WERROR=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON

      - name: Build
        run: cmake --build build-mac && ccache -s

      - name: ccache save
        uses: actions/cache/save@v5
        with:
          path: /tmp/ccache
          key: ccache-macos-${{ github.sha }}

      - name: Universal
        run: |
          lipo -archs build-mac/dmodemd/dmodemd
          lipo -archs build-mac/dmodemd/dmodemd | grep -q arm64
          lipo -archs build-mac/dmodemd/dmodemd | grep -q x86_64

      - name: Tests
        run: ctest --test-dir build-mac -L quick -j3 --output-on-failure

      - name: USB modems
        run: |
          ctest --test-dir build-mac -R 'dmodemd_(usb|pico_line|pico_wb|agere)$' \
            --repeat until-pass:2 --output-on-failure

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-macos
          path: |
            build-mac/test-logs/
            !build-mac/test-logs/latest
          if-no-files-found: ignore
          retention-days: 14

      - name: dmodemd
        uses: actions/upload-artifact@v7
        with:
          name: dmodemd-macos-universal
          path: build-mac/dmodemd/dmodemd
          retention-days: 30

  haiku:
    runs-on: ubuntu-24.04
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6

      - name: Packages
        uses: ./.github/actions/apt
        with:
          packages: >-
            cmake ninja-build pkg-config clang lld libzstd1 python3 ccache

      # Haiku's packages (checked against their repositories' SHA-256)
      - name: Haiku packages cache
        uses: actions/cache@v5
        with:
          path: haiku-packages
          key: haiku-packages-${{ hashFiles('platforms/haiku/haiku_sysroot.py') }}

      - name: Sysroot
        run: python3 platforms/haiku/haiku_sysroot.py haiku-sysroot --cache haiku-packages

      - name: libre cache
        uses: actions/cache@v5
        with:
          path: build-haiku/_deps/libre-install
          key: libre-v4.12.0-haiku-${{ hashFiles('cmake/libre.cmake', 'platforms/haiku/libre-haiku.patch', 'platforms/haiku/haiku.cmake', 'platforms/haiku/haiku_sysroot.py') }}

      - name: ccache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/ccache
          key: ccache-haiku-${{ github.sha }}
          restore-keys: ccache-haiku-

      - name: Configure
        run: |
          cmake -B build-haiku -G Ninja -DDMODEM_WERROR=ON \
            -DCMAKE_TOOLCHAIN_FILE=platforms/haiku/haiku.cmake \
            -DHAIKU_SYSROOT=$PWD/haiku-sysroot

      - name: Build
        run: cmake --build build-haiku && ccache -s

      - name: ccache save
        uses: actions/cache/save@v5
        with:
          path: /tmp/ccache
          key: ccache-haiku-${{ github.sha }}

      - name: dmodemd
        uses: actions/upload-artifact@v7
        with:
          name: dmodemd-haiku-x86_64
          path: build-haiku/dmodemd/dmodemd
          retention-days: 30

  # (the steps' scripts in the matrix: one shard each, its calls one after
  # another; shell bash -e, so the first failure ends it)
  asterisk:
    name: asterisk (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: calls
            run: |
              timeout 300 frontend/asterisk/test/run.sh
              timeout 300 frontend/asterisk/test/run.sh AT+MS=132
              LAW=alaw timeout 300 frontend/asterisk/test/run.sh
              timeout 300 frontend/asterisk/test/run.sh AT+MS=34 bbsexec
              BBS_LINGER=1 timeout 300 frontend/asterisk/test/run.sh AT+MS=34 bbsexec
              ANSWER='AT+MS=132\;A' EXPECT='ANSWERER .*DMODEMRATE=14400/14400' timeout 300 frontend/asterisk/test/run.sh
              ARI=1 timeout 300 frontend/asterisk/test/run.sh
          # SIP (D-Modem); CODEC=clearmode: an ISDN data call in RFC 4040's
          # CLEARMODE (codec_clearmode), X.75 on D-Modem's clear channel
          - shard: sip
            run: |
              timeout 300 frontend/asterisk/test/sip.sh
              INCOMING=1 timeout 300 frontend/asterisk/test/sip.sh
              CALLS=3 timeout 300 frontend/asterisk/test/sip.sh
              DIAL=ATDT timeout 300 frontend/asterisk/test/sip.sh
              HOLD=1 timeout 300 frontend/asterisk/test/sip.sh
              BBS_CONNECT_DELAY=15 timeout 300 frontend/asterisk/test/sip.sh
              CODEC=clearmode timeout 300 frontend/asterisk/test/sip.sh 'AT+MS=CLEAR'
              CODEC=clearmode INCOMING=1 timeout 300 frontend/asterisk/test/sip.sh
              ARI=1 timeout 300 frontend/asterisk/test/sip.sh
              ARI=1 INCOMING=1 timeout 300 frontend/asterisk/test/sip.sh
              ARI=1 CODEC=alaw timeout 300 frontend/asterisk/test/sip.sh
              ARI=1 ARI_SIP=1 timeout 300 frontend/asterisk/test/sip.sh
          # the FreePBX module, then the same through the latest FreePBX's
          # own dialplan classes (its framework's extensions.class.php in
          # place of the tests' stand-in)
          - shard: freepbx
            run: |
              php frontend/freepbx/test/unit.php
              timeout 300 frontend/freepbx/test/e2e.sh
              ARI=1 timeout 300 frontend/freepbx/test/e2e.sh
              git clone -q --depth 1 -b release/18.0.1.3 \
                https://github.com/FreePBX/framework /tmp/freepbx-framework
              export FREEPBX_FRAMEWORK=/tmp/freepbx-framework
              php frontend/freepbx/test/unit.php
              timeout 300 frontend/freepbx/test/e2e.sh
              ARI=1 timeout 300 frontend/freepbx/test/e2e.sh
          - shard: fax
            run: |
              timeout 900 frontend/asterisk/test/fax.sh
              timeout 900 frontend/asterisk/test/fax_spandsp.sh
              ARI=1 timeout 900 frontend/asterisk/test/fax.sh
              ARI=1 timeout 900 frontend/asterisk/test/fax_spandsp.sh
              ARI=1 ARI_SIP=1 timeout 900 frontend/asterisk/test/fax.sh
          # (about ten minutes each)
          - shard: t38
            run: timeout 1500 frontend/asterisk/test/t38.sh
          - shard: t38-ari
            run: ARI=1 timeout 1500 frontend/asterisk/test/t38.sh
          # dmodemd's class 1 fax with efax on its pty, over T.38 and not
          - shard: efax
            run: |
              timeout 900 frontend/asterisk/test/efax.sh
              T38=no timeout 900 frontend/asterisk/test/efax.sh
              DMODEMD_T38=no timeout 900 frontend/asterisk/test/efax.sh
    steps:
      - uses: actions/checkout@v6

      - name: Packages
        uses: ./.github/actions/apt
        with:
          packages: >-
            cmake ninja-build pkg-config clang g++ libssl-dev libgtest-dev
            libtiff-tools python3 efax php-cli
            libjansson-dev libxml2-dev libsqlite3-dev uuid-dev libedit-dev
            libspandsp-dev libtiff-dev libcurl4-openssl-dev bzip2 patch ccache

      # Asterisk 22 (LTS) built from source, as Ubuntu 24.04's 20.6 has a
      # T.38 gateway that passes no fax (t38.sh's cases 6 and 7)
      - name: Asterisk cache
        id: asterisk-cache
        uses: actions/cache@v5
        with:
          path: ~/asterisk
          key: asterisk-${{ runner.os }}-${{ hashFiles('frontend/asterisk/test/build_asterisk.sh') }}

      - name: Asterisk
        run: |
          [ -x ~/asterisk/sbin/asterisk ] ||
            SRC=/tmp/asterisk-src frontend/asterisk/test/build_asterisk.sh ~/asterisk
          echo ~/asterisk/sbin >> "$GITHUB_PATH"
          echo "AST_MODULES=$HOME/asterisk/lib/asterisk/modules" >> "$GITHUB_ENV"
          echo "AST_DATA=$HOME/asterisk/var/lib/asterisk" >> "$GITHUB_ENV"
          ~/asterisk/sbin/asterisk -V

      - name: libre cache
        uses: actions/cache@v5
        with:
          path: build/_deps/libre-install
          key: libre-v4.12.0-${{ runner.os }}-${{ hashFiles('cmake/libre.cmake') }}

      - name: ccache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/ccache
          key: ccache-asterisk-${{ github.sha }}
          restore-keys: ccache-asterisk-

      - name: Build
        run: |
          # app_dmodem: built here only to be tested, never shipped
          cmake -B build -G Ninja -DDMODEM_WERROR=ON \
            -DASTERISK_INCLUDE_DIR=$HOME/asterisk/include \
            -DDMODEM_APP_DMODEM=ON
          cmake --build build
          test -f build/asterisk/app_dmodem.so
          test -f build/asterisk/codec_clearmode.so
          ccache -s

      - name: ccache save
        if: matrix.shard == 'calls'
        uses: actions/cache/save@v5
        with:
          path: /tmp/ccache
          key: ccache-asterisk-${{ github.sha }}

      - name: Tests (${{ matrix.shard }})
        run: ${{ matrix.run }}

      - name: Logs of a failed step
        if: failure()
        run: |
          for f in /tmp/dmodem-*/dmodemd.log /tmp/dmodem-*/console.log \
                   /tmp/dmodem-*/dmodem-ari.log /tmp/dmodem-*/efax*.log \
                   /tmp/dmodem-*/log/freeswitch.log; do
            [ -f "$f" ] || continue
            echo "== $f"; tail -80 "$f"
          done

  freeswitch:
    name: freeswitch (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    env:
      FS_PREFIX: /home/runner/freeswitch
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          # the calls, then SIP (D-Modem)
          - shard: calls
            run: |
              timeout 300 frontend/freeswitch/test/run.sh
              timeout 300 frontend/freeswitch/test/run.sh AT+MS=132
              LAW=alaw timeout 300 frontend/freeswitch/test/run.sh
              timeout 300 frontend/freeswitch/test/run.sh AT+MS=34 bbsalaw
              timeout 300 frontend/freeswitch/test/run.sh AT+MS=34 bbsexec
              BBS_LINGER=1 timeout 300 frontend/freeswitch/test/run.sh AT+MS=34 bbsexec
              ANSWER='AT+MS=132;A' EXPECT='ANSWERER .*dmodem_rate=14400/14400' timeout 300 frontend/freeswitch/test/run.sh
              timeout 300 frontend/freeswitch/test/sip.sh
              INCOMING=1 timeout 300 frontend/freeswitch/test/sip.sh
              BBS_CONNECT_DELAY=15 timeout 300 frontend/freeswitch/test/sip.sh
          # (about seven minutes each)
          - shard: fax
            run: timeout 1200 frontend/freeswitch/test/fax.sh
          - shard: fax-t38
            run: T38=yes timeout 1200 frontend/freeswitch/test/fax.sh
    steps:
      - uses: actions/checkout@v6

      - name: Packages
        uses: ./.github/actions/apt
        with:
          packages: >-
            cmake ninja-build pkg-config clang g++ libssl-dev uuid-dev libgtest-dev
            libtiff-tools python3 build-essential autoconf automake
            libtool libtool-bin yasm libcurl4-openssl-dev libpcre3-dev
            libspeex-dev libspeexdsp-dev libsqlite3-dev libedit-dev
            libldns-dev libjpeg-dev libtiff-dev libsndfile1-dev
            zlib1g-dev libpq-dev ccache

      - name: FreeSWITCH cache
        id: fs-cache
        uses: actions/cache@v5
        with:
          path: /home/runner/freeswitch
          key: freeswitch-1.11.3-${{ runner.os }}-${{ hashFiles('frontend/freeswitch/test/build_freeswitch.sh') }}

      - name: FreeSWITCH
        if: steps.fs-cache.outputs.cache-hit != 'true'
        run: |
          SRC=/tmp/fs-src frontend/freeswitch/test/build_freeswitch.sh $FS_PREFIX

      - name: libre cache
        uses: actions/cache@v5
        with:
          path: build/_deps/libre-install
          key: libre-v4.12.0-${{ runner.os }}-${{ hashFiles('cmake/libre.cmake') }}

      - name: ccache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/ccache
          key: ccache-freeswitch-${{ github.sha }}
          restore-keys: ccache-freeswitch-

      - name: Build
        run: |
          cmake -B build -G Ninja -DDMODEM_WERROR=ON \
            -DFREESWITCH_PKGCONFIG=$FS_PREFIX/lib/pkgconfig
          cmake --build build
          test -f build/freeswitch/mod_dmodem.so
          ccache -s

      - name: ccache save
        if: matrix.shard == 'calls'
        uses: actions/cache/save@v5
        with:
          path: /tmp/ccache
          key: ccache-freeswitch-${{ github.sha }}

      - name: Tests (${{ matrix.shard }})
        run: ${{ matrix.run }}

      - name: Logs of a failed step
        if: failure()
        run: |
          for f in /tmp/dmodem-*/dmodemd.log /tmp/dmodem-*/console.log \
                   /tmp/dmodem-*/log/freeswitch.log; do
            [ -f "$f" ] || continue
            echo "== $f"; tail -80 "$f"
          done
