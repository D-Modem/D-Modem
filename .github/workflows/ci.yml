# Every job but windows-msvc builds with Clang: the build takes it where it
# is installed (DMODEM_PREFER_CLANG, cmake/mingw-w64.cmake for Windows),
# with GCC's C++ library (libstdc++; g++ and g++-multilib stay for it).
#
# build: everything (with the 32 bit interop test programs, against Smart
# Link's original DSP library) and the offline tests.  The interop calls
# (ctest -L "smartlink|agere|open" -j16, about a minute) are left out:
# they depend on the runner's timing.
#
# musl: the same build and offline tests on musl libc (Alpine).
#
# windows: the Windows build (MinGW-w64, cross from Linux) with its
# offline tests under Wine; dmodemd.exe kept as an artifact.
#
# windows-msvc: the same with Microsoft's compiler (cl.exe, Ninja) on a
# Windows runner, the offline tests on Windows itself; its dmodemd.exe
# kept as an artifact too, and the virtual modem driver's package
# (dmodemvm.dll, unsigned, when the runner's WDK has UMDF 2.15; dmodem.inf
# and dmodem-driver.exe).
#
# macos: the macOS build (11 and later) on Apple silicon, universal
# (arm64 and x86_64: libre, Mbed TLS, libusb and GoogleTest fetched and
# built for both), warnings as errors; the offline tests, and the USB
# modems' calls with the fake modems linked into dmodemd (no LD_PRELOAD
# there); dmodemd kept as an artifact.
#
# haiku: the Haiku build (x86_64, Clang, cross from Linux against a
# sysroot of Haiku's own packages, cmake/haiku_sysroot.py), warnings as
# errors; nothing here runs its programs, so no tests; dmodemd kept as an
# artifact.
#
# asterisk, freeswitch: the modules' tests (asterisk/test, freeswitch/test)
# in a private Asterisk (Ubuntu's packages) and FreeSWITCH (built from
# source by freeswitch/test/build_freeswitch.sh, cached): calls between
# two modems of the module, D-Modem (dmodemd) over SIP both ways, and
# faxes on the audio and over T.38, also against their own fax (spandsp);
# in Asterisk also through dmodem-ari, D-Modem as an ARI application, and
# dmodemd's class 1 fax with efax on its pty.
#
# A push or pull request that changes only documentation (docs/ and the
# Markdown files: nothing builds or tests from them) runs none of it.
name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config clang g++ libssl-dev libgtest-dev \
            libspandsp-dev libtiff-tools asterisk-dev g++-multilib \
            libasound2-dev libusb-1.0-0-dev

      # libre is fetched and built while configuring: keep it
      - name: libre cache
        uses: actions/cache@v4
        with:
          path: build/_deps/libre-install
          key: libre-v4.12.0-${{ runner.os }}-${{ hashFiles('cmake/libre.cmake') }}

      - name: Configure
        run: cmake -B build -G Ninja -DDMODEM_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Tests
        run: ctest --test-dir build -L "quick|spandsp|alsa" -j4 --output-on-failure

      # the failed tests' output and logs (build/test-logs/<run>/<test>/;
      # a run without a failure keeps none)
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/test-logs/
            !build/test-logs/latest
          if-no-files-found: ignore
          retention-days: 14

      # dmodemd started as root (ctest skips it as the runner's user)
      - name: dmodemd as root
        run: sudo python3 dmodemd/test/root_test.py build/dmodemd/dmodemd

  musl:
    runs-on: ubuntu-24.04
    container: alpine:3.22
    steps:
      # (git first: checkout then clones, as libre's fetch wants)
      - name: Packages
        run: |
          apk add --no-cache build-base clang cmake samurai git pkgconf \
            openssl-dev gtest-dev linux-headers alsa-lib-dev libusb-dev python3 \
            bash coreutils spandsp-dev tiff-dev tiff-tools

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Ninja -DDMODEM_WERROR=ON

      - name: Build
        run: cmake --build build

      # (as root in the container: dmodemd_root runs too)
      - name: Tests
        run: ctest --test-dir build -L "quick|spandsp|alsa" -j4 --output-on-failure

  windows:
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++-mingw-w64-x86-64-posix \
            clang lld wine wine64

      # libre and Mbed TLS are fetched and built while configuring: keep
      # them
      - name: libre cache
        uses: actions/cache@v4
        with:
          path: build-win/_deps/libre-install
          key: libre-v4.12.0-mingw-${{ hashFiles('cmake/libre.cmake', 'cmake/mingw-w64.cmake') }}

      - name: Configure
        run: |
          cmake -B build-win -G Ninja -DDMODEM_WERROR=ON \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake

      - name: Build
        run: cmake --build build-win

      # (Wine's first start makes its prefix: before the tests' timeouts)
      - name: Wine prefix
        run: wineboot --init && wineserver -w

      # (Wine's own processes, wineserver and its services, kept running
      # by an idle cmd waiting on a pipe, all with their output nowhere:
      # started by a test's wine they took its stdout with them, and
      # ctest waited on that pipe until its timeout, the test long done)
      - name: Tests
        run: |
          wineserver -p </dev/null >/dev/null 2>&1
          (sleep 7200 </dev/null 2>/dev/null | wine cmd /c "set /p x=" >/dev/null 2>&1 &)
          wine cmd /c exit </dev/null >/dev/null 2>&1
          ctest --test-dir build-win -L quick -j4 --output-on-failure

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows
          path: |
            build-win/test-logs/
            !build-win/test-logs/latest
          if-no-files-found: ignore
          retention-days: 14

      - name: dmodemd.exe
        uses: actions/upload-artifact@v4
        with:
          name: dmodemd-windows-x86_64
          path: build-win/dmodemd/dmodemd.exe
          retention-days: 30

  windows-msvc:
    runs-on: windows-2022
    steps:
      # (LF as in the repository: .gitattributes says so, this makes sure)
      - name: Line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # cl.exe and the SDK: the Developer Command Prompt's environment,
      # for every later step
      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                "$($matches[1])=$($matches[2])" |
                  Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
            }

      - name: libre cache
        uses: actions/cache@v4
        with:
          path: build-msvc/_deps/libre-install
          key: libre-v4.12.0-msvc-${{ hashFiles('cmake/libre.cmake') }}

      - name: Configure
        run: >
          cmake -B build-msvc -G Ninja -DDMODEM_WERROR=ON
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        run: cmake --build build-msvc

      - name: Tests
        run: ctest --test-dir build-msvc -L quick -j4 --output-on-failure

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows-msvc
          path: |
            build-msvc/test-logs/
            !build-msvc/test-logs/latest
          if-no-files-found: ignore
          retention-days: 14

      - name: dmodemd.exe
        uses: actions/upload-artifact@v4
        with:
          name: dmodemd-windows-msvc-x86_64
          path: build-msvc/dmodemd/dmodemd.exe
          retention-days: 30

      # (unsigned: docs/windows.md has the test signing)
      - name: Virtual modem driver
        uses: actions/upload-artifact@v4
        with:
          name: dmodem-driver-windows-x86_64-unsigned
          path: |
            build-msvc/winmodem/dmodemvm.dll
            build-msvc/winmodem/dmodem-driver.exe
            winmodem/dmodem.inf
          if-no-files-found: warn
          retention-days: 30

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: brew install ninja

      - name: libre cache
        uses: actions/cache@v4
        with:
          path: build-mac/_deps/libre-install
          key: libre-v4.12.0-macos-universal-${{ hashFiles('cmake/libre.cmake') }}

      # (GoogleTest fetched, not Homebrew's: that one is arm64 alone)
      - name: Configure
        run: |
          cmake -B build-mac -G Ninja -DDMODEM_WERROR=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON

      - name: Build
        run: cmake --build build-mac

      - name: Universal
        run: |
          lipo -archs build-mac/dmodemd/dmodemd
          lipo -archs build-mac/dmodemd/dmodemd | grep -q arm64
          lipo -archs build-mac/dmodemd/dmodemd | grep -q x86_64

      - name: Tests
        run: ctest --test-dir build-mac -L quick -j3 --output-on-failure

      - name: USB modems
        run: |
          ctest --test-dir build-mac -R 'dmodemd_(usb|pico_line|pico_wb|agere)$' \
            --repeat until-pass:2 --output-on-failure

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos
          path: |
            build-mac/test-logs/
            !build-mac/test-logs/latest
          if-no-files-found: ignore
          retention-days: 14

      - name: dmodemd
        uses: actions/upload-artifact@v4
        with:
          name: dmodemd-macos-universal
          path: build-mac/dmodemd/dmodemd
          retention-days: 30

  haiku:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config clang lld libzstd1 python3

      # Haiku's packages (checked against their repositories' SHA-256)
      - name: Haiku packages cache
        uses: actions/cache@v4
        with:
          path: haiku-packages
          key: haiku-packages-${{ hashFiles('cmake/haiku_sysroot.py') }}

      - name: Sysroot
        run: python3 cmake/haiku_sysroot.py haiku-sysroot --cache haiku-packages

      - name: libre cache
        uses: actions/cache@v4
        with:
          path: build-haiku/_deps/libre-install
          key: libre-v4.12.0-haiku-${{ hashFiles('cmake/libre.cmake', 'cmake/libre-haiku.patch', 'cmake/haiku.cmake', 'cmake/haiku_sysroot.py') }}

      - name: Configure
        run: |
          cmake -B build-haiku -G Ninja -DDMODEM_WERROR=ON \
            -DCMAKE_TOOLCHAIN_FILE=cmake/haiku.cmake \
            -DHAIKU_SYSROOT=$PWD/haiku-sysroot

      - name: Build
        run: cmake --build build-haiku

      - name: dmodemd
        uses: actions/upload-artifact@v4
        with:
          name: dmodemd-haiku-x86_64
          path: build-haiku/dmodemd/dmodemd
          retention-days: 30

  asterisk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config clang g++ libssl-dev libgtest-dev \
            libtiff-tools python3 efax php-cli \
            libjansson-dev libxml2-dev libsqlite3-dev uuid-dev libedit-dev \
            libspandsp-dev libtiff-dev libcurl4-openssl-dev bzip2 patch

      # Asterisk 22 (LTS) built from source, as Ubuntu 24.04's 20.6 has a
      # T.38 gateway that passes no fax (t38.sh's cases 6 and 7)
      - name: Asterisk cache
        id: asterisk-cache
        uses: actions/cache@v4
        with:
          path: ~/asterisk
          key: asterisk-${{ runner.os }}-${{ hashFiles('asterisk/test/build_asterisk.sh') }}

      - name: Asterisk
        run: |
          [ -x ~/asterisk/sbin/asterisk ] ||
            SRC=/tmp/asterisk-src asterisk/test/build_asterisk.sh ~/asterisk
          echo ~/asterisk/sbin >> "$GITHUB_PATH"
          echo "AST_MODULES=$HOME/asterisk/lib/asterisk/modules" >> "$GITHUB_ENV"
          echo "AST_DATA=$HOME/asterisk/var/lib/asterisk" >> "$GITHUB_ENV"
          ~/asterisk/sbin/asterisk -V

      - name: libre cache
        uses: actions/cache@v4
        with:
          path: build/_deps/libre-install
          key: libre-v4.12.0-${{ runner.os }}-${{ hashFiles('cmake/libre.cmake') }}

      - name: Build
        run: |
          cmake -B build -G Ninja -DDMODEM_WERROR=ON \
            -DASTERISK_INCLUDE_DIR=$HOME/asterisk/include
          cmake --build build
          test -f build/asterisk/app_dmodem.so

      - name: Calls
        run: |
          timeout 300 asterisk/test/run.sh
          timeout 300 asterisk/test/run.sh AT+MS=132
          LAW=alaw timeout 300 asterisk/test/run.sh
          timeout 300 asterisk/test/run.sh AT+MS=34 bbsexec
          BBS_LINGER=1 timeout 300 asterisk/test/run.sh AT+MS=34 bbsexec
          ANSWER='AT+MS=132\;A' EXPECT='ANSWERER .*DMODEMRATE=14400/14400' timeout 300 asterisk/test/run.sh
          ARI=1 timeout 300 asterisk/test/run.sh

      - name: SIP (D-Modem)
        run: |
          timeout 300 asterisk/test/sip.sh
          INCOMING=1 timeout 300 asterisk/test/sip.sh
          CALLS=3 timeout 300 asterisk/test/sip.sh
          DIAL=ATDT timeout 300 asterisk/test/sip.sh
          HOLD=1 timeout 300 asterisk/test/sip.sh
          BBS_CONNECT_DELAY=15 timeout 300 asterisk/test/sip.sh
          ARI=1 timeout 300 asterisk/test/sip.sh
          ARI=1 INCOMING=1 timeout 300 asterisk/test/sip.sh
          ARI=1 CODEC=alaw timeout 300 asterisk/test/sip.sh
          ARI=1 ARI_SIP=1 timeout 300 asterisk/test/sip.sh

      - name: FreePBX module
        run: |
          php freepbx/test/unit.php
          timeout 300 freepbx/test/e2e.sh
          ARI=1 timeout 300 freepbx/test/e2e.sh

      # (the same through the latest FreePBX's own dialplan classes: its
      # framework's extensions.class.php in place of the tests' stand-in)
      - name: FreePBX module (FreePBX 18)
        run: |
          git clone -q --depth 1 -b release/18.0.1.3 \
            https://github.com/FreePBX/framework /tmp/freepbx-framework
          export FREEPBX_FRAMEWORK=/tmp/freepbx-framework
          php freepbx/test/unit.php
          timeout 300 freepbx/test/e2e.sh
          ARI=1 timeout 300 freepbx/test/e2e.sh

      - name: Fax
        run: |
          timeout 900 asterisk/test/fax.sh
          timeout 900 asterisk/test/fax_spandsp.sh
          ARI=1 timeout 900 asterisk/test/fax.sh
          ARI=1 timeout 900 asterisk/test/fax_spandsp.sh
          ARI=1 ARI_SIP=1 timeout 900 asterisk/test/fax.sh
          timeout 1500 asterisk/test/t38.sh
          ARI=1 timeout 1500 asterisk/test/t38.sh

      # dmodemd's class 1 fax with efax on its pty, over T.38 and not
      - name: Fax (dmodemd)
        run: |
          timeout 900 asterisk/test/efax.sh
          T38=no timeout 900 asterisk/test/efax.sh
          DMODEMD_T38=no timeout 900 asterisk/test/efax.sh

      - name: Logs of a failed step
        if: failure()
        run: |
          for f in /tmp/dmodem-*/dmodemd.log /tmp/dmodem-*/console.log \
                   /tmp/dmodem-*/dmodem-ari.log /tmp/dmodem-*/efax*.log \
                   /tmp/dmodem-*/log/freeswitch.log; do
            [ -f "$f" ] || continue
            echo "== $f"; tail -80 "$f"
          done

  freeswitch:
    runs-on: ubuntu-24.04
    env:
      FS_PREFIX: /home/runner/freeswitch
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config clang g++ libssl-dev uuid-dev libgtest-dev \
            libtiff-tools python3 build-essential autoconf automake \
            libtool libtool-bin yasm libcurl4-openssl-dev libpcre3-dev \
            libspeex-dev libspeexdsp-dev libsqlite3-dev libedit-dev \
            libldns-dev libjpeg-dev libtiff-dev libsndfile1-dev \
            zlib1g-dev libpq-dev

      - name: FreeSWITCH cache
        id: fs-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/freeswitch
          key: freeswitch-1.11.3-${{ runner.os }}-${{ hashFiles('freeswitch/test/build_freeswitch.sh') }}

      - name: FreeSWITCH
        if: steps.fs-cache.outputs.cache-hit != 'true'
        run: |
          SRC=/tmp/fs-src freeswitch/test/build_freeswitch.sh $FS_PREFIX

      - name: libre cache
        uses: actions/cache@v4
        with:
          path: build/_deps/libre-install
          key: libre-v4.12.0-${{ runner.os }}-${{ hashFiles('cmake/libre.cmake') }}

      - name: Build
        run: |
          cmake -B build -G Ninja -DDMODEM_WERROR=ON \
            -DFREESWITCH_PKGCONFIG=$FS_PREFIX/lib/pkgconfig
          cmake --build build
          test -f build/freeswitch/mod_dmodem.so

      - name: Calls
        run: |
          timeout 300 freeswitch/test/run.sh
          timeout 300 freeswitch/test/run.sh AT+MS=132
          LAW=alaw timeout 300 freeswitch/test/run.sh
          timeout 300 freeswitch/test/run.sh AT+MS=34 bbsalaw
          timeout 300 freeswitch/test/run.sh AT+MS=34 bbsexec
          BBS_LINGER=1 timeout 300 freeswitch/test/run.sh AT+MS=34 bbsexec
          ANSWER='AT+MS=132;A' EXPECT='ANSWERER .*dmodem_rate=14400/14400' timeout 300 freeswitch/test/run.sh

      - name: SIP (D-Modem)
        run: |
          timeout 300 freeswitch/test/sip.sh
          INCOMING=1 timeout 300 freeswitch/test/sip.sh
          BBS_CONNECT_DELAY=15 timeout 300 freeswitch/test/sip.sh

      - name: Fax
        run: |
          timeout 1200 freeswitch/test/fax.sh
          T38=yes timeout 1200 freeswitch/test/fax.sh

      - name: Logs of a failed step
        if: failure()
        run: |
          for f in /tmp/dmodem-*/dmodemd.log /tmp/dmodem-*/console.log \
                   /tmp/dmodem-*/log/freeswitch.log; do
            [ -f "$f" ] || continue
            echo "== $f"; tail -80 "$f"
          done
