[modem-answer]
exten => s,1,DModem(bbs)
 same => n,Verbose(1,ANSWERER DMODEMSTATUS=${DMODEMSTATUS} DMODEMRATE=${DMODEMRATE})
 same => n,Hangup()

[modem-call]
exten => s,1,DModem(term,o)
 same => n,Verbose(1,CALLER DMODEMSTATUS=${DMODEMSTATUS} DMODEMRATE=${DMODEMRATE})
 same => n,Hangup()

; calls from SIP (sip.sh)
[modem-in]
exten => _X.,1,DModem(bbs)
 same => n,Verbose(1,ANSWERER DMODEMSTATUS=${DMODEMSTATUS} DMODEMRATE=${DMODEMRATE})
 same => n,Hangup()

; fax (fax.sh): DModem() answering a fax machine, and the fax apps
[fax-auto]
exten => s,1,DModem(bbs)
 same => n,Verbose(1,AUTO DMODEMSTATUS=${DMODEMSTATUS} DMODEMFAXSTATUS=${DMODEMFAXSTATUS} DMODEMFAXPAGES=${DMODEMFAXPAGES} DMODEMFAXFILE=${DMODEMFAXFILE} DMODEMFAXREMOTE=${DMODEMFAXREMOTE})
 same => n,Hangup()

[fax-recv]
exten => s,1,DModemReceiveFax(${FAXOUT},+1 555 0199)
 same => n,Verbose(1,RECV DMODEMFAXSTATUS=${DMODEMFAXSTATUS} DMODEMFAXRESULT=${DMODEMFAXRESULT} DMODEMFAXPAGES=${DMODEMFAXPAGES} DMODEMFAXRATE=${DMODEMFAXRATE} DMODEMFAXREMOTE=${DMODEMFAXREMOTE})
 same => n,Hangup()

[fax-send]
exten => s,1,DModemSendFax(${FAXIN},+1 555 0100)
 same => n,Verbose(1,SEND DMODEMFAXSTATUS=${DMODEMFAXSTATUS} DMODEMFAXRESULT=${DMODEMFAXRESULT} DMODEMFAXPAGES=${DMODEMFAXPAGES} DMODEMFAXRATE=${DMODEMFAXRATE} DMODEMFAXREMOTE=${DMODEMFAXREMOTE})
 same => n,Hangup()
