[modem-answer]
exten => s,1,DModem(bbs)
 same => n,Verbose(1,ANSWERER DMODEMSTATUS=${DMODEMSTATUS} DMODEMRATE=${DMODEMRATE})
 same => n,Hangup()

[modem-call]
exten => s,1,DModem(term,o)
 same => n,Verbose(1,CALLER DMODEMSTATUS=${DMODEMSTATUS} DMODEMRATE=${DMODEMRATE})
 same => n,Hangup()

; sip.sh VOICE=1: the call to D-Modem answered in voice mode; a DTMF
; digit to it (RFC 4733), then time for its tones and flashes
[modem-voice]
exten => s,1,Wait(1)
 same => n,SendDTMF(5)
 same => n,Wait(10)
 same => n,Hangup()

; calls from SIP (sip.sh)
[modem-in]
; sip.sh VOICE_DIAL=1: D-Modem's voice calls (ATD in voice mode): 7001
; rings 2 s, answers, sends the DTMF digit 7 and hangs up 4 s later;
; 7002 is busy; 7003 rings and does not answer
exten => 7001,1,Ringing()
 same => n,Wait(2)
 same => n,Answer()
 same => n,Wait(1)
 same => n,SendDTMF(7)
 same => n,Wait(3)
 same => n,Hangup()
exten => 7002,1,Busy(5)
exten => 7003,1,Ringing()
 same => n,Wait(30)
 same => n,Hangup()
exten => _X.,1,DModem(bbs)
 same => n,Verbose(1,ANSWERER DMODEMSTATUS=${DMODEMSTATUS} DMODEMRATE=${DMODEMRATE})
 same => n,Hangup()

; fax (fax.sh): DModem() answering a fax machine, and the fax apps
[fax-auto]
exten => s,1,DModem(bbs)
 same => n,Hangup()
exten => h,1,Verbose(1,AUTO DMODEMSTATUS=${DMODEMSTATUS} DMODEMFAXSTATUS=${DMODEMFAXSTATUS} DMODEMFAXPAGES=${DMODEMFAXPAGES} DMODEMFAXFILE=${DMODEMFAXFILE} DMODEMFAXREMOTE=${DMODEMFAXREMOTE} DMODEMFAXECM=${DMODEMFAXECM})

[fax-recv]
exten => s,1,DModemReceiveFax(${FAXOUT},+1 555 0199)
 same => n,Hangup()
exten => h,1,Verbose(1,RECV DMODEMFAXSTATUS=${DMODEMFAXSTATUS} DMODEMFAXRESULT=${DMODEMFAXRESULT} DMODEMFAXPAGES=${DMODEMFAXPAGES} DMODEMFAXRATE=${DMODEMFAXRATE} DMODEMFAXREMOTE=${DMODEMFAXREMOTE} DMODEMFAXECM=${DMODEMFAXECM})

[fax-send]
exten => s,1,DModemSendFax(${FAXIN},+1 555 0100)
 same => n,Hangup()
exten => h,1,Verbose(1,SEND DMODEMFAXSTATUS=${DMODEMFAXSTATUS} DMODEMFAXRESULT=${DMODEMFAXRESULT} DMODEMFAXPAGES=${DMODEMFAXPAGES} DMODEMFAXRATE=${DMODEMFAXRATE} DMODEMFAXREMOTE=${DMODEMFAXREMOTE} DMODEMFAXECM=${DMODEMFAXECM})

; Asterisk's own fax (res_fax_spandsp) against DModem's (fax_spandsp.sh)
; the result lines in h: the far end hangs up when the fax is done
[sp-send]
exten => s,1,SendFAX(${FAXIN})
 same => n,Hangup()
exten => h,1,Verbose(1,SPSEND FAXSTATUS=${FAXSTATUS} FAXERROR=${FAXERROR} FAXPAGES=${FAXPAGES} FAXBITRATE=${FAXBITRATE} REMOTESTATIONID=${REMOTESTATIONID})

[sp-recv]
exten => s,1,ReceiveFAX(${SPOUT})
 same => n,Hangup()
exten => h,1,Verbose(1,SPRECV FAXSTATUS=${FAXSTATUS} FAXERROR=${FAXERROR} FAXPAGES=${FAXPAGES} FAXBITRATE=${FAXBITRATE} REMOTESTATIONID=${REMOTESTATIONID})

; T.38 (t38.sh): Asterisk calls itself, out on loopout (or loopaudio,
; without T.38), in on loopin
[t38-in]
exten => recv,1,DModemReceiveFax(${FAXOUT},+1 555 0199)
 same => n,Hangup()
exten => send,1,DModemSendFax(${FAXIN},+1 555 0100)
 same => n,Hangup()
exten => auto,1,DModem(bbs)
 same => n,Hangup()
; Asterisk's T.38 gateway between a call on the audio (from loopaudio)
; and DModem over T.38 (gw), or DModem over T.38 and ReceiveFAX on the
; audio (gwrecv: its own T.38 refused, ReceiveFAX on the audio, f)
exten => gw,1,Set(FAXOPT(gateway)=yes)
 same => n,Dial(PJSIP/auto@loopout)
 same => n,Hangup()
exten => gwrecv,1,Set(FAXOPT(gateway)=yes)
 same => n,Dial(PJSIP/sprecv@loopaudio)
 same => n,Hangup()
exten => sprecv,1,ReceiveFAX(${SPOUT},f)
 same => n,Hangup()
exten => h,1,Verbose(1,T38IN DMODEMSTATUS=${DMODEMSTATUS} DMODEMFAXSTATUS=${DMODEMFAXSTATUS} DMODEMFAXRESULT=${DMODEMFAXRESULT} DMODEMFAXPAGES=${DMODEMFAXPAGES} DMODEMFAXRATE=${DMODEMFAXRATE} DMODEMFAXREMOTE=${DMODEMFAXREMOTE} DMODEMFAXECM=${DMODEMFAXECM} DMODEMFAXT38=${DMODEMFAXT38})

; the calling side's fax when it is DModem's
[t38-send]
exten => s,1,DModemSendFax(${FAXIN},+1 555 0100)
 same => n,Hangup()
exten => h,1,Verbose(1,T38SEND DMODEMFAXSTATUS=${DMODEMFAXSTATUS} DMODEMFAXRESULT=${DMODEMFAXRESULT} DMODEMFAXPAGES=${DMODEMFAXPAGES} DMODEMFAXRATE=${DMODEMFAXRATE} DMODEMFAXREMOTE=${DMODEMFAXREMOTE} DMODEMFAXECM=${DMODEMFAXECM} DMODEMFAXT38=${DMODEMFAXT38})

; a receiver calling (t38.sh case 8): its T.38 request reaches DModem()
; before the modems connect
[t38-recvcall]
exten => s,1,DModemReceiveFax(${FAXOUT}.caller)
 same => n,Hangup()

[t38-none]
exten => _X.,1,Hangup()

; dmodemd's fax (efax.sh): efax on its pty calls ReceiveFAX (f: on the
; audio if there's no T.38), or SendFAX calls it (SENDOPT: f, or fF on
; the audio from the start)
[efax-in]
exten => _X.,1,ReceiveFAX(${SPOUT},f)
 same => n,Hangup()
exten => h,1,Verbose(1,EFAXRECV FAXSTATUS=${FAXSTATUS} FAXERROR=${FAXERROR} FAXPAGES=${FAXPAGES} FAXBITRATE=${FAXBITRATE} REMOTESTATIONID=${REMOTESTATIONID})

[efax-send]
exten => s,1,SendFAX(${FAXIN},${SENDOPT})
 same => n,Hangup()
exten => h,1,Verbose(1,EFAXSEND FAXSTATUS=${FAXSTATUS} FAXERROR=${FAXERROR} FAXPAGES=${FAXPAGES} FAXBITRATE=${FAXBITRATE} REMOTESTATIONID=${REMOTESTATIONID})
