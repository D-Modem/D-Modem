; a SIP account for D-Modem (slmodemd + d-modem) to call DModem() with
[transport-udp]
type = transport
protocol = udp
bind = 127.0.0.1:5070

[modem]
type = endpoint
context = modem-in
disallow = all
allow = ulaw
allow = alaw
auth = modem-auth
aors = modem
direct_media = no
rtp_symmetric = yes

[modem-auth]
type = auth
auth_type = userpass
username = modem
password = modem

[modem]
type = aor
max_contacts = 1
